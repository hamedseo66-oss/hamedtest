<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revita – Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #f2e8de;
      direction: rtl;
    }

    /* ── NAVBAR ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 52px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #1b2a3b;
      letter-spacing: -0.5px;
    }
    .logo em { color: #e05a2b; font-style: italic; }

    nav ul {
      list-style: none;
      display: flex;
      gap: 36px;
    }
    nav a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
      font-weight: 500;
    }
    nav a.active { color: #e05a2b; font-weight: 700; }

    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #333;
      font-size: 18px;
    }

    /* ── HERO ── */
    .hero {
      padding: 8px 36px 56px;
      position: relative;
    }

    /* ظرف اصلی */
    .hero-inner {
      position: relative;
      border-radius: 48px;
      overflow: visible; /* کارت باید بیرون بیاید */
    }

    /* تصویر اصلی */
    .hero-img {
      width: 100%;
      height: 480px;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 48px;
      display: block;
    }

    /* ── کارت "Peace in body / Move in life" ── */
    .hero-card {
      position: absolute;
      bottom: -28px;
      left: 48px;
      background: #cce5f5;
      border-radius: 36px;
      padding: 28px 36px 28px 100px; /* فضا برای آیکون */
      display: flex;
      align-items: center;
      min-width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .hero-card p {
      font-size: 26px;
      line-height: 1.45;
      color: #4a6278;
      font-weight: 400;
      direction: ltr;
      text-align: left;
    }

    .hero-card p strong {
      font-weight: 900;
      color: #1b2a3b;
    }

    /* ── آیکون آدمک ── */
    .hero-icon {
      position: absolute;
      bottom: -10px;
      left: 40px;
      width: 72px;
    }

    /* SVG آیکون آدمک ریویتا */
    .revita-figure {
      fill: none;
      stroke: #1b2a3b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header>
  <button class="search-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </button>

  <nav>
    <ul>
      <li><a href="#" class="active">صفحه نخست</a></li>
      <li><a href="#">درباره ما</a></li>
      <li><a href="#">بلاگ</a></li>
      <li><a href="#">منو کافه</a></li>
      <li><a href="#">تماس با ما</a></li>
    </ul>
  </nav>

  <div class="logo">R<em>e</em>vita</div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">

    <!-- تصویر اصلی -->
    <img
      class="hero-img"
      src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=1400&q=85"
      alt="فیزیوتراپیست در حال کمک به ورزش روی تردمیل"
    />

    <!-- کارت متن -->
    <div class="hero-card">
      <p>
        Peace in <strong>body</strong><br />
        Move in <strong>life</strong>
      </p>
    </div>

    <!-- آیکون آدمک -->
    <div class="hero-icon">
      <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
        <!-- سر -->
        <circle cx="30" cy="10" r="7" class="revita-figure"/>
        <!-- بدن -->
        <line x1="30" y1="17" x2="30" y2="50" class="revita-figure"/>
        <!-- دست‌ها - باز -->
        <line x1="30" y1="28" x2="8"  y2="22" class="revita-figure"/>
        <line x1="30" y1="28" x2="52" y2="22" class="revita-figure"/>
        <!-- پاها -->
        <line x1="30" y1="50" x2="14" y2="76" class="revita-figure"/>
        <line x1="30" y1="50" x2="46" y2="76" class="revita-figure"/>
      </svg>
    </div>

  </div>
</section>

</body>
</html>
